<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Test Runner & PDF Exporter</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>Antigravity Test Runner & PDF Exporter</h2>
  <div id="status">Memuat index.html...</div>
  <iframe id="app-frame" src="/index.html" style="width: 1000px; height: 800px; border: 1px solid #ccc;"></iframe>

  <script>
    const iframe = document.getElementById("app-frame");

    async function waitForServices(win, maxRetries = 20) {
      for (let i = 0; i < maxRetries; i++) {
        if (win.TestSuite && win.GenerateService && win.jspdf) {
          return true;
        }
        await new Promise(r => setTimeout(r, 200));
      }
      return false;
    }

    iframe.onload = async () => {
      const win = iframe.contentWindow;
      const statusEl = document.getElementById("status");
      statusEl.textContent = "Menunggu inisialisasi modul...";

      const ready = await waitForServices(win);
      if (!ready) {
        const err = new Error("Layanan TestSuite/GenerateService/jspdf tidak tersedia setelah batas waktu.");
        statusEl.textContent = "Error: " + err.message;
        await fetch("/api/save-preview-pdf", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ error: err.message })
        });
        return;
      }

      statusEl.textContent = "Menjalankan TestSuite...";

      try {
        // 1. Run all unit tests
        const testLogs = await win.TestSuite.runAllTests();
        console.log("Test logs:", testLogs);

        // 2. Generate PDF for September 2026 using Section 7.2 dataset
        statusEl.textContent = "Meng-export PDF September 2026...";
        // At the end of runAllTests, September 2026 was the last dataset applied!
        const docSep = await win.GenerateService.exportPDF(
          "NUR ROHMAN SETIAWAN",
          "-",
          "-",
          8, // 8 is September (0-indexed)
          2026,
          30
        );
        const pdfSepDataUri = docSep.output("datauristring");
        const pageCountSep = docSep.internal.getNumberOfPages();

        // 3. Generate PDF for August 2026 using Section 7.1 dataset
        statusEl.textContent = "Meng-export PDF Agustus 2026...";
        const fixtureAgu = {
          "karyawan": { "id": "KRY001", "nama": "Nur Rohman Setiawan", "jabatan": "Administrator" },
          "bulan": 8, "tahun": 2026,
          "remarks_default": "Pulomas office pek perpustakaan",
          "absen": [
            { "tanggal": "2026-08-02", "pulang": "17:20" },
            { "tanggal": "2026-08-03", "masuk": "19:25", "pulang": "00:10" },
            { "tanggal": "2026-08-04", "masuk": "19:50", "pulang": "00:05" },
            { "tanggal": "2026-08-05", "masuk": "19:55", "pulang": "00:00" },
            { "tanggal": "2026-08-06", "masuk": "20:04", "pulang": "22:20" },
            { "tanggal": "2026-08-07", "status": "wfh", "remarks": "" },
            { "tanggal": "2026-08-09", "masuk": "08:50", "pulang": "16:17" },
            { "tanggal": "2026-08-10", "masuk": "20:00", "pulang": "00:05" },
            { "tanggal": "2026-08-11", "masuk": "19:30", "pulang": "00:15" },
            { "tanggal": "2026-08-12", "masuk": "19:54", "pulang": "23:25" },
            { "tanggal": "2026-08-13", "masuk": "19:25", "pulang": "22:40" },
            { "tanggal": "2026-08-14", "status": "wfh", "remarks": "" },
            { "tanggal": "2026-08-16", "masuk": "08:05", "pulang": "16:16" },
            { "tanggal": "2026-08-18", "masuk": "15:40", "pulang": "20:30" },
            { "tanggal": "2026-08-19", "masuk": "13:40", "pulang": "21:50", "remarks": "Ancol dan Pulomas office pek perpustakaan" },
            { "tanggal": "2026-08-20", "status": "wfh", "remarks": "" },
            { "tanggal": "2026-08-21", "status": "wfh", "remarks": "" },
            { "tanggal": "2026-08-22", "pulang": "09:25" },
            { "tanggal": "2026-08-23", "masuk": "08:10", "pulang": "16:30" },
            { "tanggal": "2026-08-24", "masuk": "20:55" },
            { "tanggal": "2026-08-25", "masuk": "08:50", "pulang": "16:50" },
            { "tanggal": "2026-08-26", "status": "izin", "remarks": "" },
            { "tanggal": "2026-08-27", "masuk": "08:15", "pulang": "16:30" },
            { "tanggal": "2026-08-28", "masuk": "08:25", "pulang": "17:00" },
            { "tanggal": "2026-08-29", "masuk": "08:00", "pulang": "13:10" },
            { "tanggal": "2026-08-30", "masuk": "08:00", "pulang": "17:00" },
            { "tanggal": "2026-08-31", "masuk": "08:30", "pulang": "16:35" }
          ]
        };
        const parsedAgu = win.ImportService.parse(JSON.stringify(fixtureAgu), { bulan: 7, tahun: 2026 });
        await win.ImportService.apply(parsedAgu, { mode: "replace", fillEmp: true });

        const docAgu = await win.GenerateService.exportPDF(
          "Nur Rohman Setiawan",
          "KRY001",
          "Administrator",
          7, // 7 is Agustus (0-indexed)
          2026,
          31
        );
        const pdfAguDataUri = docAgu.output("datauristring");
        const pageCountAgu = docAgu.internal.getNumberOfPages();

        // 4. Send test results and both PDFs to local node server
        statusEl.textContent = "Mengirim data ke server...";
        await fetch("/api/save-preview-pdf", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            pdfSepBase64: pdfSepDataUri,
            pageCountSep: pageCountSep,
            pdfAguBase64: pdfAguDataUri,
            pageCountAgu: pageCountAgu,
            testLogs: testLogs
          })
        });

        statusEl.textContent = "Selesai! Semua tes lolos dan PDF berhasil disimpan.";
      } catch (err) {
        console.error("Runner error:", err);
        statusEl.textContent = "Error: " + err.message;
        await fetch("/api/save-preview-pdf", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            error: err.message,
            stack: err.stack
          })
        });
      }
    };
  </script>
</body>
</html>
